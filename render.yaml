# Render Blueprint for the API. Frontend goes on Vercel (root directory: frontend). See docs/DEPLOY.md.
services:
  - type: web
    name: counterpart-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AGNES_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: SARVAM_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STORAGE_BACKEND
        value: supabase
      - key: DEMO_PASSWORD
        generateValue: true
      - key: OWNER_API_TOKEN
        generateValue: true
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Instagram and WhatsApp webhooks (set when connecting channels; see docs/CHANNELS.md)
      - key: META_APP_SECRET
        sync: false
      - key: INSTAGRAM_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
